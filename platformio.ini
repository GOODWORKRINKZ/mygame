; ============================================================
;  LED Arcade — консоль на ESP32-C3 (PlatformIO / Arduino)
; ============================================================
[platformio]
default_envs = esp32-c3

[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
; Для плат "ESP32-C3 SuperMini" (очень распространены) используйте:
; board = lolin_c3_mini
; (закомментируйте строку board выше)
framework = arduino
monitor_speed = 115200
; У ESP32-C3 загрузчик шумит на 74880 бод до старта приложения —
; ловим их на стандартной скорости монитора.
monitor_port = COM31
upload_port = COM31
upload_speed = 921600

; Уровни лога: 0=silent, 1=info, 2=debug, 3=verbose
; ARDUINO_USB_CDC_ON_BOOT=1 + ARDUINO_USB_MODE=1 переключает Serial
; на нативный USB-CDC (нужно на платах с нативным USB: DevKitM-1,
; SuperMini с USB-C). Без этого Serial = UART0, а у таких плат
; GPIO20/21 наружу не выведены — лога не будет.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DLOG_LEVEL=2

lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.3
    adafruit/Adafruit GFX Library@^1.11.11
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit BusIO@^1.16.3
